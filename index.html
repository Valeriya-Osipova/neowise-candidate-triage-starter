<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; color: #1b1b1b; background: #fff; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; margin: .5rem 0 0; }
    #hint { min-height: 1.5rem; }
    #panel { margin-top: 1.5rem; }
    #topic-line { font-weight: 600; }
    h2 { font-size: 1rem; margin: 1rem 0 0; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form id="triage-form">
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <div id="feedback" aria-live="polite">
    <p id="hint" role="status"></p>
    <section id="panel" hidden>
      <p id="status-line"></p>
      <p id="topic-line"></p>
      <label for="draft">Черновик ответа</label>
      <textarea id="draft" rows="4" placeholder="Черновик появится после разбора или введите ответ вручную"></textarea>
      <h2>Исходная заявка</h2>
      <pre id="source"></pre>
    </section>
  </div>
  <script type="module">
    import { createController, validateInput } from "./client-state.mjs";

    const form = document.querySelector("#triage-form");
    const message = document.querySelector("#message");
    const hint = document.querySelector("#hint");
    const panel = document.querySelector("#panel");
    const messageLine = document.querySelector("#status-line");
    const topicLine = document.querySelector("#topic-line");
    const draft = document.querySelector("#draft");
    const source = document.querySelector("#source");
    const ui = createController();

    function render() {
      const view = ui.view;
      hint.textContent = view.phase === "invalid" ? view.message : "";
      panel.hidden = !view.showPanel;
      messageLine.textContent = view.showPanel ? view.message : "";
      topicLine.textContent = view.topicLabel ? `Тема: ${view.topicLabel}` : "";
      draft.value = view.draft;
      source.textContent = view.source;
      draft.readOnly = view.loading;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const check = validateInput(message.value);
      if (!check.ok) {
        ui.rejectInput();
        render();
        return;
      }

      const id = ui.start(check.text);
      render();
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: check.text }),
        });
        let body = null;
        try {
          body = await reply.json();
        } catch {
          ui.fail(id, check.text);
          render();
          return;
        }
        ui.settle(id, { status: reply.status, body }, check.text);
        render();
      } catch {
        ui.fail(id, check.text);
        render();
      }
    });
  </script>
</body>
</html>
